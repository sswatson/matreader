[package]
name = "matreader"
version = "0.1.0"
edition = "2021"
authors = ["Samuel S. Watson"]
description = "A TUI for lazily exploring MATLAB .mat files (v5/v6/v7 and v7.3)"
license = "MIT"

[[bin]]
name = "matreader"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
memmap2 = "0.9"
hdf5-pure = "0.43"
unicode-width = "0.2"

[profile.release]
strip = true
lto = "thin"
